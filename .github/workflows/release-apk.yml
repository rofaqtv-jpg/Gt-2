name: Publish Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-debug-apk:
    name: Build and Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required Android packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          ASSET_NAME="OpenCityMini-${TAG}-debug.apk"

          gh release create "${TAG}" \
            --title "Open City Mini ${TAG}" \
            --generate-notes \
            "${APK_PATH}#${ASSET_NAME}"
